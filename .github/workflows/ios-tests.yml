name: iOS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CI: true
      SOURCE_PACKAGES_DIR: build/SourcePackages

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-xcode26.5-${{ hashFiles('Trailhound.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26.5-

      - name: Pick simulator
        run: |
          chmod +x scripts/ci_pick_simulator.sh scripts/run_tests.sh
          DESTINATION="$(./scripts/ci_pick_simulator.sh)"
          echo "Using destination: ${DESTINATION}"
          echo "DESTINATION=${DESTINATION}" >> "$GITHUB_ENV"

      - name: Build for testing
        run: XCODEBUILD_ACTION=build-for-testing ./scripts/run_tests.sh

      - name: Run unit tests
        run: XCODEBUILD_ACTION=test-without-building INCLUDE_UI_TESTS=0 ./scripts/run_tests.sh

      - name: Run UI tests
        if: github.event_name == 'push'
        run: XCODEBUILD_ACTION=test-without-building ONLY_UI_TESTS=1 ./scripts/run_tests.sh

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: build/TestResults.xcresult
          if-no-files-found: ignore
